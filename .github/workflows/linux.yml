name: Linux

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: ${{matrix.os}}-GCC-${{matrix.build_type}}
    runs-on: ${{matrix.os}}
    defaults:
      run:
        shell: bash
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      fail-fast: true
      matrix:
        build_type: [Debug, Release]
        os: [ubuntu-26.04, ubuntu-26.04-arm]

    steps:
      - uses: actions/checkout@v7

      # Ubuntu ships OpenCV and Eigen older than ORB-SLAM requires, so these
      # come from the dependency script.
      - name: Setup Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            --no-install-recommends --no-install-suggests \
            g++ \
            libboost-program-options-dev

      # ng-log fails to configure with CMake 4.5, so the job builds with the
      # most recent CMake 4.4 and its Ninja.
      - name: Setup CMake
        uses: lukka/get-cmake@v4.5.0
        with:
          cmakeVersion: "~4.4.0"

      # Both build types link the same optimized dependencies.
      - name: Cache Dependencies
        id: cache-dependencies
        uses: actions/cache@v6
        with:
          path: deps/
          key: ${{matrix.os}}-dependencies-${{hashFiles('.github/scripts/build-dependencies.cmake')}}

      - name: Build Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          cmake -D PREFIX=deps \
                -D BUILD_TYPE=Release \
                -D 'PACKAGES=Eigen3;g2o;ng-log;OpenCV' \
                -P .github/scripts/build-dependencies.cmake

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: ${{matrix.os}}-${{matrix.build_type}}
          evict-old-files: job
          save: ${{ github.event_name == 'push' }}

      - name: Configure
        run: |
          cmake -S . -B build/ \
                -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_PREFIX_PATH="$PWD/deps" \
                -Werror=dev

      - name: Build
        run: |
          cmake --build build/

      - name: Test
        run: |
          ctest --test-dir build/ \
                -j"$(nproc)" \
                --output-on-failure
